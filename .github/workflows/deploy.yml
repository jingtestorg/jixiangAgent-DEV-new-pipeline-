# Deploy to Joule Studio
# Trigger manually from GitHub UI: Actions > Deploy to Joule Studio > Run workflow
#
# When triggered from a tag:  downloads the GitHub release ZIP and deploys it directly (no build).
# When triggered from a branch: builds from source code, then deploys.
#
# Required organization secrets (Settings > Secrets and variables > Actions > Secrets):
#   SCI_TENANT_URL   - Issuer URI of the SAP Cloud Identity Services tenant
#   SCI_CLIENT_ID    - Client ID of the SCI application
#   JOULE_STUDIO_URL - Base URL of the Joule Studio solution handling API
#   SCI_CLIENT_SECRET - Client secret of the SCI application
#
# Setup:
#   1. This file is pushed automatically by Joule Studio when you push your solution
#   2. Set the required organization secrets listed above
#   3. Grant this repository access to each organization secret
#   4. Complete the SCI client credentials configuration described in SETUP.md

name: Deploy to Joule Studio

on:
  workflow_dispatch:  # manual trigger only

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Joule Studio CLI
        uses: ./.github/actions/setup-jl

      - name: Fetch SCI token via client secret
        id: fetch-token
        uses: ./.github/actions/token-fetch
        with:
          sciTenantUrl: ${{ secrets.SCI_TENANT_URL }}
          sciClientId: ${{ secrets.SCI_CLIENT_ID }}
          sciClientSecret: ${{ secrets.SCI_CLIENT_SECRET }}

      # Tag: download tag source ZIP from GitHub API, unzip in place, then deploy
      - name: Download and prepare tag ZIP
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download source ZIP for the tag via GitHub API (works with tags, no Release needed)
          gh api "repos/${{ github.repository }}/zipball/${{ github.ref_name }}" > /tmp/release.zip
          echo "✅ Downloaded source ZIP for tag ${{ github.ref_name }}"

          # Unzip into a temp dir, strip the top-level directory GitHub adds
          mkdir -p /tmp/release-content
          unzip -q /tmp/release.zip -d /tmp/release-content
          TOP_DIR=$(ls /tmp/release-content)
          echo "DEPLOY_DIR=/tmp/release-content/$TOP_DIR" >> "$GITHUB_ENV"

      # Branch: use checkout code directly
      - name: Set deploy dir for branch
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "DEPLOY_DIR=${{ github.workspace }}" >> "$GITHUB_ENV"

      # Branch only: build is needed
      - name: Build solution
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          cd "$DEPLOY_DIR"
          jl solution build

      - name: Deploy solution
        env:
          JOULE_STUDIO_TOKEN: ${{ steps.fetch-token.outputs.sciToken }}
          JOULE_STUDIO_HOST: ${{ secrets.JOULE_STUDIO_URL }}
        run: |
          cd "$DEPLOY_DIR"
          jl solution deploy --force
